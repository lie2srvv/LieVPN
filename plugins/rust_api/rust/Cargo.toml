[package]
name = "rust_api"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_api"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rquickjs = { version = "0.12", default-features = false }

# The IPC server exists so a desktop Core process can talk to the app. Mobile platforms (Android, iOS)
# do not use desktop IPC / desktop global-hotkeys.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
interprocess = "2"
global-hotkey = "0.8"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libc = "0.2"

# rquickjs ships pre-generated bindings for every target this project builds
# except the Android ones, which have to be generated during the build.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
