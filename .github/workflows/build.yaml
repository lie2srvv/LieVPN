name: Build LieVPN (Windows & iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.1'
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup & Build Windows
        run: dart setup.dart windows -v

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LieVPN-Windows
          path: ./dist/*
          overwrite: true

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode_15.4*.app" | sort -r | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.1'
          cache: true

      - name: Get Flutter Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Patch Dependencies for iOS
        run: |
          python3 -c "
          import glob
          for p in glob.glob('/Users/runner/.pub-cache/**/FPPDeviceInfoPlusPlugin.m', recursive=True):
              with open(p, 'r') as f:
                  c = f.read()
              if 'isiOSAppOnVision' in c:
                  c = c.replace('[[NSProcessInfo processInfo] isiOSAppOnVision]', 'NO')
                  with open(p, 'w') as f:
                      f.write(c)
                  print('Patched isiOSAppOnVision in:', p)
          "

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -r build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -r -q LieVPN-1.0.4-ios.ipa Payload
          cp LieVPN-1.0.4-ios.ipa LieVPN-ios.ipa
          rm -rf Payload
          ls -lh

      - name: Upload iOS IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LieVPN-iOS-IPA
          path: ./dist/*.ipa
          overwrite: true
