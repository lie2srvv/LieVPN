name: Build LieNetwork

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup & Build Windows
        run: dart setup.dart windows -v

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LieNetwork-Windows
          path: ./dist/*
          overwrite: true

      - name: Release Windows to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup appimagetool wrapper
        run: |
          sudo wget -O /opt/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x /opt/appimagetool
          cat << 'WRAPPER' | sudo tee /usr/local/bin/appimagetool > /dev/null
          #!/bin/bash
          # Intercept AppDir before packing into AppImage:
          # 1. Remove libstdc++ and libgcc_s to prevent OpenGL/EGL ABI conflicts with host Mesa drivers.
          # 2. Patch AppRun to reliably resolve libraries relative to AppImage location.
          for arg in "$@"; do
            if [ -d "$arg" ] && [ -f "$arg/AppRun" ]; then
              echo "Sanitizing AppDir for portable graphics: $arg"
              rm -f "$arg/usr/lib/libstdc++.so"* "$arg/usr/lib/libgcc_s.so"*
              cat << 'RUNNER' > "$arg/AppRun"
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "${HERE}/LieNetwork" "$@"
          RUNNER
              chmod +x "$arg/AppRun"
            fi
          done
          exec /opt/appimagetool --appimage-extract-and-run "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup & Build Linux
        run: dart setup.dart linux -v

      - name: Prepare standard release names
        run: |
          cd ./dist
          ls -la
          for f in LieNetwork-*-linux-amd64.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" LieNetwork.AppImage
            fi
          done
          ls -la

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LieNetwork-Linux
          path: ./dist/*
          overwrite: true

      - name: Release Linux to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
